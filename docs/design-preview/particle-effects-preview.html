<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex 悬浮助手 · 粒子效果提案</title>
    <style>
        /* 页面基础视觉：保持接近 macOS 深色工具面板的中性石墨背景。 */
        :root { color-scheme: dark; --bg: #080a0d; --panel: #0d1015; --card: #171b21; --line: rgba(255,255,255,.09); --text: #f4f6f8; --muted: #89929d; --amber: #efb953; --green: #34d399; --blue: #67d8ff; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body { margin: 0; background: radial-gradient(circle at 50% -20%, #202833 0, var(--bg) 46%); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
        button { font: inherit; }
        .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 54px 0 72px; }
        .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--amber); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
        .eyebrow::before { content: ""; width: 24px; height: 1px; background: currentColor; }
        h1 { margin: 14px 0 10px; font-size: clamp(30px, 5vw, 52px); line-height: 1.05; letter-spacing: -.045em; }
        .intro { max-width: 650px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }

        /* 放大舞台只展示当前方案，便于观察真实任务内容上的遮挡和运动节奏。 */
        .stage-panel { margin-top: 34px; padding: 20px; border: 1px solid var(--line); border-radius: 22px; background: rgba(13,16,21,.82); box-shadow: 0 26px 80px rgba(0,0,0,.35); backdrop-filter: blur(24px); }
        .stage-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
        .stage-index { color: var(--amber); font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
        .stage-title { margin: 5px 0 3px; font-size: 21px; letter-spacing: -.02em; }
        .stage-copy { margin: 0; color: var(--muted); font-size: 13px; }
        .toolbar { display: flex; gap: 8px; }
        .toolbar button { min-width: 78px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.035); color: #cbd1d8; cursor: pointer; transition: border-color .18s, background .18s, color .18s; }
        .toolbar button:hover { border-color: rgba(239,185,83,.4); color: #fff; }
        .toolbar button.active { border-color: rgba(239,185,83,.5); background: rgba(239,185,83,.11); color: #ffd27a; }
        .stage-wrap { display: grid; place-items: center; min-height: 170px; overflow: hidden; border: 1px solid rgba(255,255,255,.055); border-radius: 15px; background: radial-gradient(circle at 50% 30%, #171b21, #0b0e12 70%); }
        .stage-card { width: min(760px, calc(100% - 36px)); height: 92px; transform: translateZ(0); }

        /* 候选网格使用真实 62px 高度，点击整张卡即可切换上方放大效果。 */
        .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 38px 0 14px; }
        .section-head h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
        .section-head span { color: #69727e; font-size: 12px; }
        .proposal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .proposal { padding: 16px; border: 1px solid var(--line); border-radius: 17px; background: rgba(13,16,21,.72); cursor: pointer; text-align: left; transition: transform .2s ease, border-color .2s ease, background .2s ease; }
        .proposal:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.18); background: rgba(18,22,28,.9); }
        .proposal.selected { border-color: rgba(239,185,83,.54); box-shadow: inset 0 0 0 1px rgba(239,185,83,.08); }
        .proposal-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .proposal-name { color: #dde2e8; font-size: 13px; font-weight: 650; }
        .proposal-code { color: #5f6976; font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
        .proposal .task-card { width: 100%; height: 62px; }
        .proposal-note { margin: 11px 2px 0; color: #737d89; font-size: 12px; line-height: 1.55; }

        /* 任务卡复刻当前 Dashboard 的核心层级，Canvas 始终处在内容下方。 */
        .task-card { position: relative; overflow: hidden; border: 1px solid rgba(239,185,83,.64); border-radius: 10px; background: #171b21; box-shadow: 0 8px 24px rgba(0,0,0,.22); }
        .task-card canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .task-content { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; width: 100%; height: 100%; padding: 0 10px; }
        .status-icon { position: relative; flex: 0 0 auto; display: grid; place-items: center; width: 31px; height: 31px; border-radius: 8px; color: #f0b74c; background: rgba(88,62,25,.76); box-shadow: inset 0 0 0 1px rgba(255,203,98,.07); }
        .status-icon svg { width: 16px; height: 16px; }
        .task-text { min-width: 0; flex: 1; }
        .task-title { overflow: hidden; color: rgba(255,255,255,.94); font-size: 15px; font-weight: 620; line-height: 1.15; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.85); }
        .task-subtitle { overflow: hidden; margin-top: 5px; color: rgba(255,255,255,.48); font-size: 11px; line-height: 1; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 2px #000; }
        .project { color: #67d8ff; }
        .status-pill { flex: 0 0 auto; padding: 7px 10px; border: 1px solid rgba(242,185,76,.13); border-radius: 999px; color: #e5ab41; background: rgba(78,54,20,.88); font-size: 11px; font-weight: 600; box-shadow: 0 2px 9px rgba(0,0,0,.2); }
        .stage-card .task-content { gap: 14px; padding: 0 15px; }
        .stage-card .status-icon { width: 44px; height: 44px; border-radius: 11px; }
        .stage-card .status-icon svg { width: 20px; height: 20px; }
        .stage-card .task-title { font-size: 20px; }
        .stage-card .task-subtitle { margin-top: 7px; font-size: 13px; }
        .stage-card .status-pill { padding: 9px 13px; font-size: 13px; }

        /* 页面底部明确预览边界，避免把 HTML 误解为已经接入 App。 */
        .footnote { display: flex; align-items: center; gap: 10px; margin-top: 22px; color: #616b77; font-size: 12px; }
        .footnote::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #efb953; box-shadow: 0 0 10px rgba(239,185,83,.7); }
        @media (max-width: 780px) { .shell { width: min(100% - 24px, 1180px); padding-top: 30px; } .proposal-grid { grid-template-columns: 1fr; } .stage-head { align-items: stretch; flex-direction: column; } .toolbar { align-self: flex-start; } }
        @media (prefers-reduced-motion: reduce) { .proposal { transition: none; } }
    </style>
</head>
<body>
    <!-- 页面说明与当前选中方案。 -->
    <main class="shell">
        <div class="eyebrow">Particle Direction Study</div>
        <h1>少一点烟花感，<br>多一点精密感。</h1>
        <p class="intro">四个方案都把亮度压在文字层后面，并围绕“正在处理”的持续状态设计。先看真实任务卡，再点击候选进入放大观察。</p>

        <!-- 放大舞台会复用选中方案的同一套绘制逻辑。 -->
        <section class="stage-panel" aria-labelledby="stage-title">
            <div class="stage-head">
                <div>
                    <div class="stage-index" id="stage-index">OPTION 01</div>
                    <h2 class="stage-title" id="stage-title">金线流光</h2>
                    <p class="stage-copy" id="stage-copy">细线顺着任务方向流动，光点只做节拍，不铺满背景。</p>
                </div>
                <div class="toolbar" aria-label="预览控制">
                    <button id="motion-toggle" type="button">暂停</button>
                    <button id="contrast-toggle" type="button">低亮度</button>
                </div>
            </div>
            <div class="stage-wrap">
                <div class="task-card stage-card" data-effect="silk">
                    <canvas aria-hidden="true"></canvas>
                    <div class="task-content"></div>
                </div>
            </div>
        </section>

        <!-- 四张真实高度任务卡用于并排比较不同运动语言。 -->
        <div class="section-head"><h2>四个候选</h2><span>真实高度 · 62 px</span></div>
        <section class="proposal-grid" id="proposal-grid">
            <button class="proposal selected" type="button" data-effect="silk" data-index="01" data-title="金线流光" data-copy="细线顺着任务方向流动，光点只做节拍，不铺满背景。">
                <div class="proposal-meta"><span class="proposal-name">金线流光</span><span class="proposal-code">SILK TRACE</span></div>
                <div class="task-card" data-effect="silk"><canvas aria-hidden="true"></canvas><div class="task-content"></div></div>
                <p class="proposal-note">速度明确、干扰最少。适合默认运行态。</p>
            </button>
            <button class="proposal" type="button" data-effect="aurora" data-index="02" data-title="极光微尘" data-copy="冷暖光雾缓慢呼吸，微尘只在暗部浮动，整体更柔和。">
                <div class="proposal-meta"><span class="proposal-name">极光微尘</span><span class="proposal-code">AURORA DUST</span></div>
                <div class="task-card" data-effect="aurora"><canvas aria-hidden="true"></canvas><div class="task-content"></div></div>
                <p class="proposal-note">氛围更高级，方向感弱，适合长任务。</p>
            </button>
            <button class="proposal" type="button" data-effect="orbit" data-index="03" data-title="磁场轨道" data-copy="少量粒子沿三条隐形轨道穿行，节奏像数据正在被处理。">
                <div class="proposal-meta"><span class="proposal-name">磁场轨道</span><span class="proposal-code">FIELD ORBIT</span></div>
                <div class="task-card" data-effect="orbit"><canvas aria-hidden="true"></canvas><div class="task-content"></div></div>
                <p class="proposal-note">科技感更强，轨迹清晰但不会扫过整块卡片。</p>
            </button>
            <button class="proposal" type="button" data-effect="edge" data-index="04" data-title="边缘星火" data-copy="运动集中在上下边缘，中间内容区保持安静，是最克制的方案。">
                <div class="proposal-meta"><span class="proposal-name">边缘星火</span><span class="proposal-code">EDGE SPARK</span></div>
                <div class="task-card" data-effect="edge"><canvas aria-hidden="true"></canvas><div class="task-content"></div></div>
                <p class="proposal-note">文字最清楚，适合不想让动画抢注意力的场景。</p>
            </button>
        </section>
        <div class="footnote">这是视觉预览，尚未接入 SwiftUI。</div>
    </main>

    <script>
        // 任务内容模板只负责模拟现有 Dashboard 层级，不参与粒子绘制。
        const taskMarkup = `<div class="status-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8.2 7.4a5.2 5.2 0 0 1 7.6 0M7.4 15.8a5.2 5.2 0 0 1 0-7.6M15.8 16.6a5.2 5.2 0 0 1-7.6 0M16.6 8.2a5.2 5.2 0 0 1 0 7.6"/><circle cx="12" cy="12" r="2.3"/></svg></div><div class="task-text"><div class="task-title">优化悬浮助手的运行状态</div><div class="task-subtitle"><span class="project">codex-notch-macos-app</span> · 正在分析界面细节</div></div><div class="status-pill">运行中</div>`;
        document.querySelectorAll('.task-content').forEach(node => { node.innerHTML = taskMarkup; });

        // 固定种子生成器保证刷新后粒子分布一致，便于对比而不是每次看到不同结果。
        function randomSeries(seed, count) { let value = seed >>> 0; return Array.from({ length: count }, () => { value = (value * 1664525 + 1013904223) >>> 0; return value / 4294967296; }); }
        const seeds = { aurora: randomSeries(17, 96), orbit: randomSeries(29, 72), edge: randomSeries(41, 96) };
        const palette = { amber: [239, 185, 83], cyan: [103, 216, 255], green: [52, 211, 153] };
        let motionPaused = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let lowContrast = false;

        // Canvas 按设备像素比同步尺寸，避免在 Retina 屏幕上出现模糊轨迹。
        function prepareCanvas(canvas) { const rect = canvas.getBoundingClientRect(); const dpr = Math.min(window.devicePixelRatio || 1, 2); const width = Math.max(1, Math.round(rect.width * dpr)); const height = Math.max(1, Math.round(rect.height * dpr)); if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; } const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, width: rect.width, height: rect.height }; }
        function rgba(color, alpha) { return `rgba(${color[0]},${color[1]},${color[2]},${alpha * (lowContrast ? .56 : 1)})`; }
        function glowDot(ctx, x, y, radius, color, alpha) { const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius * 4); gradient.addColorStop(0, rgba(color, alpha)); gradient.addColorStop(.25, rgba(color, alpha * .45)); gradient.addColorStop(1, rgba(color, 0)); ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(x, y, radius * 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = rgba(color, Math.min(1, alpha * 1.4)); ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill(); }

        // 金线流光：多条低振幅曲线共享方向，但使用不同速度避免机械同步。
        function drawSilk(ctx, width, height, time) { ctx.save(); ctx.globalCompositeOperation = 'screen'; const rows = [.23, .39, .58, .76]; rows.forEach((row, index) => { const phase = time * (.22 + index * .018) + index * .21; const color = index === 2 ? palette.cyan : palette.amber; ctx.beginPath(); for (let step = 0; step <= 40; step += 1) { const x = width * step / 40; const envelope = Math.sin(Math.PI * step / 40); const y = height * row + Math.sin(step * .32 + phase * Math.PI * 2) * (1.5 + index * .34) * envelope; step === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } const gradient = ctx.createLinearGradient(0, 0, width, 0); const head = ((phase % 1) + 1) % 1; gradient.addColorStop(0, rgba(color, .015)); gradient.addColorStop(Math.max(0, head - .22), rgba(color, .02)); gradient.addColorStop(head, rgba(color, .34)); gradient.addColorStop(Math.min(1, head + .16), rgba(color, .03)); gradient.addColorStop(1, rgba(color, .01)); ctx.strokeStyle = gradient; ctx.lineWidth = index === 2 ? 1.05 : .72; ctx.stroke(); const dotX = width * head; const dotY = height * row + Math.sin((head * 40) * .32 + phase * Math.PI * 2) * (1.5 + index * .34) * Math.sin(Math.PI * head); glowDot(ctx, dotX, dotY, index === 2 ? 1.15 : .82, color, .76); }); ctx.restore(); }

        // 极光微尘：两层柔光缓慢横移，点状微尘仅补充深度，不形成密集星空。
        function drawAurora(ctx, width, height, time) { ctx.save(); ctx.globalCompositeOperation = 'screen'; const centers = [{ x: width * (.25 + Math.sin(time * .17) * .08), y: height * .72, color: palette.amber }, { x: width * (.72 + Math.cos(time * .13) * .09), y: height * .24, color: palette.cyan }]; centers.forEach(item => { const radius = width * .25; const gradient = ctx.createRadialGradient(item.x, item.y, 0, item.x, item.y, radius); gradient.addColorStop(0, rgba(item.color, .11)); gradient.addColorStop(.45, rgba(item.color, .038)); gradient.addColorStop(1, rgba(item.color, 0)); ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height); }); for (let i = 0; i < 12; i += 1) { const base = i * 5; const x = ((seeds.aurora[base] + time * (.012 + seeds.aurora[base + 1] * .014)) % 1) * width; const y = (seeds.aurora[base + 2] * .82 + .09 + Math.sin(time * .7 + i) * .025) * height; const pulse = .24 + Math.sin(time * 1.4 + seeds.aurora[base + 3] * 8) * .12; const color = seeds.aurora[base + 4] > .72 ? palette.cyan : palette.amber; glowDot(ctx, x, y, .55 + seeds.aurora[base] * .52, color, pulse); } ctx.restore(); }

        // 磁场轨道：粒子沿不可见的缓弧移动，仅在粒子附近留下短暂轨迹。
        function drawOrbit(ctx, width, height, time) { ctx.save(); ctx.globalCompositeOperation = 'screen'; const tracks = [.25, .5, .75]; tracks.forEach((row, track) => { for (let index = 0; index < 3; index += 1) { const seed = seeds.orbit[track * 12 + index * 3]; const progress = (seed + time * (.075 + track * .009 + index * .006)) % 1; const color = track === 1 && index === 1 ? palette.cyan : palette.amber; const point = offset => { const p = progress - offset; return { x: p * width, y: height * row + Math.sin(p * Math.PI * 2 + track * 1.7) * (2.4 + track * .5) }; }; ctx.beginPath(); for (let step = 7; step >= 0; step -= 1) { const p = point(step * .012); step === 7 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); } const head = point(0); const gradient = ctx.createLinearGradient(head.x - width * .09, head.y, head.x, head.y); gradient.addColorStop(0, rgba(color, 0)); gradient.addColorStop(1, rgba(color, .46)); ctx.strokeStyle = gradient; ctx.lineWidth = .8; ctx.stroke(); glowDot(ctx, head.x, head.y, .86, color, .72); } }); ctx.restore(); }

        // 边缘星火：所有运动被约束在上下边缘，中心文字区始终保持干净。
        function drawEdge(ctx, width, height, time) { ctx.save(); ctx.globalCompositeOperation = 'screen'; for (let i = 0; i < 14; i += 1) { const base = i * 5; const speed = .035 + seeds.edge[base] * .055; const progress = (seeds.edge[base + 1] + time * speed) % 1; const top = seeds.edge[base + 2] > .5; const x = progress * (width + 30) - 15; const inset = 2.2 + seeds.edge[base + 3] * 6.5; const y = top ? inset : height - inset; const color = seeds.edge[base + 4] > .82 ? palette.cyan : palette.amber; const length = 7 + seeds.edge[base] * 13; const gradient = ctx.createLinearGradient(x - length, y, x, y); gradient.addColorStop(0, rgba(color, 0)); gradient.addColorStop(1, rgba(color, .5)); ctx.strokeStyle = gradient; ctx.lineWidth = .55 + seeds.edge[base + 3] * .42; ctx.beginPath(); ctx.moveTo(x - length, y + (top ? 1.5 : -1.5)); ctx.lineTo(x, y); ctx.stroke(); glowDot(ctx, x, y, .58 + seeds.edge[base] * .38, color, .66); } const edgeGradient = ctx.createLinearGradient(0, 0, width, 0); edgeGradient.addColorStop(0, rgba(palette.amber, 0)); edgeGradient.addColorStop(.48, rgba(palette.amber, .12)); edgeGradient.addColorStop(1, rgba(palette.amber, 0)); ctx.strokeStyle = edgeGradient; ctx.lineWidth = .55; ctx.beginPath(); ctx.moveTo(0, .5); ctx.lineTo(width, .5); ctx.moveTo(0, height - .5); ctx.lineTo(width, height - .5); ctx.stroke(); ctx.restore(); }

        // 主动画循环只更新 Canvas；暂停时固定当前时间，不改变已选方案。
        let frozenTime = 0;
        function render(now) { const time = motionPaused ? frozenTime : now / 1000; document.querySelectorAll('.task-card').forEach(card => { const canvas = card.querySelector('canvas'); const { ctx, width, height } = prepareCanvas(canvas); ctx.clearRect(0, 0, width, height); const effect = card.dataset.effect; if (effect === 'silk') drawSilk(ctx, width, height, time); if (effect === 'aurora') drawAurora(ctx, width, height, time); if (effect === 'orbit') drawOrbit(ctx, width, height, time); if (effect === 'edge') drawEdge(ctx, width, height, time); }); requestAnimationFrame(render); }
        requestAnimationFrame(render);

        // 候选点击后同步标题、说明和放大舞台，并保留每张真实尺寸卡持续运行。
        const stageCard = document.querySelector('.stage-card');
        document.querySelectorAll('.proposal').forEach(proposal => { proposal.addEventListener('click', () => { document.querySelectorAll('.proposal').forEach(item => item.classList.remove('selected')); proposal.classList.add('selected'); stageCard.dataset.effect = proposal.dataset.effect; document.getElementById('stage-index').textContent = `OPTION ${proposal.dataset.index}`; document.getElementById('stage-title').textContent = proposal.dataset.title; document.getElementById('stage-copy').textContent = proposal.dataset.copy; }); });

        // 两个控制按钮只改变动画播放和整体亮度，避免引入无关的参数面板。
        const motionToggle = document.getElementById('motion-toggle');
        const contrastToggle = document.getElementById('contrast-toggle');
        motionToggle.textContent = motionPaused ? '播放' : '暂停';
        motionToggle.addEventListener('click', () => { motionPaused = !motionPaused; motionToggle.textContent = motionPaused ? '播放' : '暂停'; motionToggle.classList.toggle('active', motionPaused); });
        contrastToggle.addEventListener('click', () => { lowContrast = !lowContrast; contrastToggle.textContent = lowContrast ? '标准亮度' : '低亮度'; contrastToggle.classList.toggle('active', lowContrast); });
    </script>
</body>
</html>
