name: CodexNotchIOS
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
packages:
  CodexNotchShared:
    path: ..
targets:
  CodexNotchIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CodexNotchIOS
    dependencies:
      - package: CodexNotchShared
        product: CodexNotchShared
      - target: CodexNotchLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.codex.notch.ios
        INFOPLIST_FILE: CodexNotchIOS/App/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_VERSION: 5.9
  CodexNotchLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CodexNotchLiveActivity
      - path: CodexNotchIOS/LiveActivity/CodexTaskActivityAttributes.swift
    dependencies:
      - package: CodexNotchShared
        product: CodexNotchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.codex.notch.ios.liveactivity
        INFOPLIST_FILE: CodexNotchLiveActivity/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        SKIP_INSTALL: YES
        SWIFT_VERSION: 5.9
